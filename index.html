<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카페 우화 雨話</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6eee3;--ink:#2b211d;--red:#c8402e;--blue:#2f4fa0;--mint:#8cc7b8;--honey:#c8913f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c1a22;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--cream)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.lbl .nm{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(43,33,29,.62);color:var(--cream)}
.lbl.me .nm{background:rgba(200,64,46,.88)}
.lbl .bub{display:none;max-width:200px;white-space:normal;margin:0 auto 5px;padding:6px 10px;border-radius:12px;background:var(--cream);color:var(--ink);font-size:13px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.25);word-break:keep-all;overflow-wrap:anywhere}
.lbl .bub.on{display:block}
.lbl .zz{display:none;font-family:'Gowun Batang',serif;font-size:13px;color:#cfd8f0;animation:zz 2.4s infinite}
.lbl .zz.on{display:block}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#hud{position:fixed;left:16px;top:14px;pointer-events:none}
#hud h1{margin:0;font-family:'Gowun Batang',serif;font-weight:700;font-size:20px;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.55)}
#hud h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:15px}
#clock,#count{margin-top:3px;font-size:13px;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#clock{font-family:'Gowun Batang',serif}
#cash{margin-top:6px;display:inline-block;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(43,33,29,.6);text-shadow:none}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-6px);padding:8px 16px;border-radius:14px;background:rgba(43,33,29,.88);font-size:13.5px;opacity:0;transition:all .3s;pointer-events:none;z-index:6;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);text-align:center;opacity:0;pointer-events:none;z-index:7;transition:opacity .4s}
#banner.on{opacity:1;animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
#banner .big{font-family:'Gowun Batang',serif;font-weight:700;font-size:min(22vw,120px);line-height:1;color:#fff;letter-spacing:.04em;text-shadow:0 6px 0 var(--red),0 14px 30px rgba(0,0,0,.35)}
#banner.am .big{text-shadow:0 6px 0 var(--honey),0 14px 30px rgba(0,0,0,.3)}
#banner .sub{margin-top:14px;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4)}100%{transform:translate(-50%,-50%) scale(1)}}
#offPop{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) scale(.95);padding:20px 22px 18px;border-radius:20px;background:rgba(43,33,29,.94);border:1px solid rgba(246,238,227,.18);text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:8;width:min(320px,calc(100% - 40px))}
#offPop.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#offPop .q{font-family:'Gowun Batang',serif;font-size:17px;margin-bottom:4px}
#offPop .s{font-size:12.5px;opacity:.7;margin-bottom:16px}
#offPop .row{display:flex;gap:8px}
#offPop button{flex:1;border:none;font:inherit;font-size:15px;padding:12px 8px;border-radius:14px;cursor:pointer;color:#fff}
#goHome{background:var(--red)}#stay{background:#3d4a5c}
.coin{position:absolute;left:0;top:0;color:#ffd166;font-weight:700;font-size:15px;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6);animation:heart 1.8s ease-out forwards;white-space:nowrap}
#menuPop button:disabled{opacity:.4;cursor:default}
#menuPop button:disabled:hover{background:rgba(246,238,227,.06);border-color:rgba(246,238,227,.15)}
#snd{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.pill{border:1px solid rgba(246,238,227,.25);background:rgba(43,33,29,.55);color:var(--cream);font:inherit;font-size:12px;padding:6px 11px;border-radius:16px;cursor:pointer;backdrop-filter:blur(6px)}
.pill.off{opacity:.45}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(720px,calc(100% - 20px))}
.act{border:1px solid rgba(246,238,227,.2);background:rgba(43,33,29,.72);color:var(--cream);font:inherit;font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s}
.act b{font-weight:400;opacity:.5;margin-right:5px;font-size:11px}
.act.on{background:var(--red);border-color:var(--red)}
.act:disabled{opacity:.35;cursor:default}
#chatf{display:flex;flex:1 1 220px;min-width:180px}
#chat{flex:1;border:1px solid rgba(246,238,227,.2);background:rgba(43,33,29,.72);color:var(--cream);font:inherit;font-size:13px;padding:9px 12px;border-radius:12px;outline:none;backdrop-filter:blur(6px)}
#chat::placeholder{color:rgba(246,238,227,.45)}
#chat:focus{border-color:var(--red)}
#log{position:fixed;left:16px;bottom:70px;width:min(300px,60vw);pointer-events:none;display:flex;flex-direction:column;gap:3px}
#log div{font-size:12.5px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.85);transition:opacity 1.2s;word-break:keep-all;overflow-wrap:anywhere}
#log div i{font-style:normal;color:#ffc59c}
.heart{position:absolute;left:0;top:0;color:#ff6f86;font-size:18px;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.3);animation:heart 1.6s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:var(--p) translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:var(--p) translateY(-46px) scale(1.15)}}
#menuPop{position:fixed;left:50%;bottom:66px;transform:translateX(-50%) translateY(8px);display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:rgba(43,33,29,.9);backdrop-filter:blur(8px);border:1px solid rgba(246,238,227,.18);opacity:0;pointer-events:none;transition:all .2s;z-index:5;min-width:230px}
#menuPop.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#menuPop .mt{font-family:'Gowun Batang',serif;font-size:14px;margin:0 2px 4px;opacity:.85}
#menuPop button{display:flex;align-items:center;gap:8px;border:1px solid rgba(246,238,227,.15);background:rgba(246,238,227,.06);color:var(--cream);font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left}
#menuPop button:hover{background:var(--red);border-color:var(--red)}
#menuPop button b{font-weight:400;opacity:.5;font-size:11px;width:10px}
#menuPop button small{margin-left:auto;opacity:.6;font-size:11px}
#hint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);font-size:13px;padding:5px 12px;border-radius:12px;background:rgba(43,33,29,.72);opacity:0;transition:opacity .25s;pointer-events:none}
#hint.on{opacity:1}
#joy{position:fixed;left:22px;bottom:150px;width:116px;height:116px;border-radius:50%;background:rgba(246,238,227,.1);border:1px solid rgba(246,238,227,.25);display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(246,238,227,.4)}
body.touch #joy{display:block}
body.touch #log{bottom:280px}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(43,33,29,.45),rgba(20,16,16,.88));z-index:10;transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
.card{width:min(380px,calc(100% - 40px));text-align:center;padding:34px 28px 26px}
.card .kicker{font-size:12px;letter-spacing:.3em;opacity:.65}
.card h2{font-family:'Gowun Batang',serif;font-size:40px;margin:10px 0 2px;letter-spacing:.06em}
.card h2 small{font-size:22px;opacity:.6;margin-left:6px}
.card p.tag{font-family:'Gowun Batang',serif;font-size:15px;opacity:.88;margin:14px 0 26px;line-height:1.7}
.nametag{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.nametag .lab{font-size:12px;opacity:.6}
#nm{font-family:'Gowun Batang',serif;font-size:19px;color:#ffc59c}
#reroll{border:none;background:none;color:var(--cream);opacity:.6;cursor:pointer;font-size:16px;padding:4px}
#reroll:hover{opacity:1}
#swatch{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
#swatch button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#swatch button.sel{border-color:var(--cream);transform:scale(1.15)}
#chs{display:flex;gap:8px;margin:0 0 12px}
#chs button{flex:1;border:1px solid rgba(246,238,227,.22);background:rgba(246,238,227,.06);color:var(--cream);font:inherit;padding:10px 6px;border-radius:14px;cursor:pointer;line-height:1.35}
#chs button b{display:block;font-size:15px}#chs button small{font-size:11.5px;opacity:.65}
#chs button.sel{background:rgba(200,64,46,.9);border-color:var(--red)}
#codeRow{display:none;margin:0 0 16px}#codeRow.on{display:block}
#code{width:150px;text-align:center;letter-spacing:.5em;font:inherit;font-size:20px;padding:8px 0 8px .5em;border-radius:12px;border:1px solid rgba(246,238,227,.3);background:rgba(0,0,0,.25);color:var(--cream);outline:none}
#code:focus{border-color:var(--red)}
#codeMsg{font-size:12px;min-height:16px;margin-top:6px;color:#ffb4a0}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#chTag{margin-top:4px;font-size:12px;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#enter{border:none;background:var(--red);color:#fff;font:inherit;font-size:16px;padding:12px 34px;border-radius:24px;cursor:pointer;letter-spacing:.06em;box-shadow:0 6px 20px rgba(200,64,46,.35)}
#enter:hover{filter:brightness(1.08)}
.keys{margin-top:20px;font-size:12px;opacity:.6;line-height:1.8}
@media (max-width:560px){#hud h1{font-size:17px}.act{padding:7px 9px;font-size:12px}.act b{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud"><h1>카페 우화<span>雨話</span></h1><div id="clock"></div><div id="count">문을 여는 중…</div><div id="cash">💰 0원</div><div id="chTag"></div></div>
<div id="snd"><button class="pill" id="tCh" title="채널 바꾸기" style="display:none">🔁 채널</button><button class="pill" id="tTime" title="시간대 미리보기">🕰 실시간</button><button class="pill" id="tMusic">음악</button><button class="pill" id="tAmb">바깥 소리</button></div>
<div id="log"></div>
<div id="hint"></div><div id="toast"></div><div id="banner"><div class="big"></div><div class="sub"></div></div><div id="offPop"><div class="q">오늘도 수고했어요</div><div class="s">퇴근할까요, 조금만 더 할까요?</div><div class="row"><button id="goHome">🌸 퇴근한다</button><button id="stay">🌙 야근한다</button></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="bar">
  <button class="act" data-a="sip" id="sipBtn"><b>1</b>☕ 주문</button>
  <button class="act" data-a="read"><b>2</b>📖 책 읽기</button>
  <button class="act" data-a="work" id="workBtn"><b>3</b>💻 작업</button>
  <button class="act" id="sitBtn"><b>F</b>🪑 앉기</button>
  <div id="menuPop"><div class="mt">무엇을 주문할까요? <span id="mCash"></span></div><button data-d="ha"><b>1</b>☕ 핫 아메리카노<small></small></button><button data-d="ia"><b>2</b>🧊 아이스 아메리카노<small></small></button><button data-d="hl"><b>3</b>🥛 핫 라떼<small></small></button><button data-d="il"><b>4</b>🧋 아이스 라떼<small></small></button></div>
  <form id="chatf" autocomplete="off"><input id="chat" maxlength="80" placeholder="Enter 로 쓰고, Enter 로 말하기"></form>
</div>
<div id="intro">
  <div class="card">
    <div class="kicker">A SUNLIT CORNER CAFE · NOON TO NIGHT</div>
    <h2>우화<small>雨話</small></h2>
    <p class="tag">볕이 바닥을 건너 노을이 될 때까지,<br>아무것도 하지 않아도 되는 자리.</p>
    <div class="nametag"><span class="lab">오늘의 이름</span><span id="nm"></span><button id="reroll" title="다른 이름">↻</button></div>
    <div id="swatch"></div>
    <div id="chs"><button data-ch="1"><b>🔒 채널 1</b><small>번호 입력 필요</small></button><button data-ch="2" class="sel"><b>채널 2</b><small>누구나 입장</small></button></div>
    <div id="codeRow"><input id="code" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····"><div id="codeMsg"></div></div>
    <button id="enter">문 열고 들어가기</button>
    <div class="keys">클릭·WASD 이동 · 의자 클릭 앉기 · 드래그 시점<br>1 주문·홀짝 · 2 책 · 3 노트북 작업(캐쉬 적립) · 고양이 클릭 쓰담</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- identity ---------- */
const ADJ=['볕 드는','반쯤 식은','창가의','노을 진','졸린','느긋한','쌉싸름한','조용한','따뜻한','나른한','늦은 오후의','접힌','바스락거리는','말랑한','설탕 없는','두 번째 잔의','햇살 묻은','빈둥대는'];
const NOUN=['라떼','각설탕','머그잔','책갈피','원두','시나몬','휘핑','마들렌','찻잎','스콘','고양이','엽서','모카','크레마','비스코티','유리창','의자','타일'];
const COLORS=['#171615','#f1ede6','#c8402e','#2f4fa0','#8cc7b8','#e9b44c','#e0632a','#6a8f5a']; // t-shirt colours
const newName=()=>pick(ADJ)+' '+pick(NOUN);
let me={name:newName(),c:Math.floor(Math.random()*COLORS.length)};
try{const s=JSON.parse(localStorage.getItem('uhwa-me')||'null');if(s&&typeof s.name==='string'&&s.name.length<30&&COLORS[s.c])me={name:s.name,c:s.c}}catch(e){}
function saveMe(){try{localStorage.setItem('uhwa-me',JSON.stringify(me))}catch(e){}}

/* ---------- renderer ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1c1a22');
const camera=new THREE.PerspectiveCamera(50,1,0.1,80);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?64:50;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o||{}));
function add(geo,mat,x,y,z,parent,noShadow){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(!noShadow){m.castShadow=true;m.receiveShadow=true}(parent||scene).add(m);return m}
const box=(w,h,d,mat,x,y,z,p,ns)=>add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p,ns);
const cyl=(rt,rb,h,mat,x,y,z,p,seg)=>add(new THREE.CylinderGeometry(rt,rb,h,seg||20),mat,x,y,z,p);
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}

/* ---------- palette (from the reference photos) ---------- */
const C={tile:'#8e4a4c',grout:'#9c706c',wall:'#ece2d5',ceil:'#e2d8ca',steel:'#2e2925',honey:'#c8913f',red:'#c8402e',blue:'#2f4fa0',mint:'#8cc7b8',orange:'#e0632a',wood:'#a8784a',woodDark:'#7a5434',frame:'#8a8f96',stainless:'#c9cbcf'};

/* ---------- textures ---------- */
const tileTex=canvasTex(512,512,(g,w,h)=>{
  const n=4,s=w/n;g.fillStyle=C.grout;g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const l=rand(-4,4);g.fillStyle=`hsl(356,${rand(24,29)}%,${37+l}%)`;g.fillRect(i*s+3,j*s+3,s-6,s-6);
    for(let k=0;k<40;k++){g.fillStyle=`rgba(255,240,240,${rand(.02,.05)})`;g.fillRect(i*s+rand(4,s-8),j*s+rand(4,s-8),rand(2,8),rand(2,6))}}
},[9,7]);
const plasterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle=C.wall;g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){g.fillStyle=`rgba(${Math.random()<.5?255:150},${Math.random()<.5?235:120},${Math.random()<.5?220:100},${rand(.02,.07)})`;g.fillRect(rand(0,w),rand(0,h),rand(1,5),rand(1,5))}},[4,2]);
const whiteTileTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d8d6d0';g.fillRect(0,0,w,h);const s=32;for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){g.fillStyle=`hsl(40,10%,${rand(90,95)}%)`;g.fillRect(x+1.5,y+1.5,s-3,s-3)}g.fillStyle='#3d6fb0';g.fillRect(0,h*.62,w,14)},[6,1]);
const mosaicTex=canvasTex(256,64,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);const s=8;for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){const edge=x<s||y<s||x>=w-s||y>=h-s;const ix=x/s,iy=y/s;const d=edge||(iy===2||iy===h/s-3)||((ix+iy)%5===0&&iy>2&&iy<h/s-3);g.fillStyle=d?'#1d1d1d':'#f4f2ee';g.fillRect(x+.6,y+.6,s-1.2,s-1.2)}});

/* ---------- room ---------- */
const W=8,D=6,H=3.8;
const outside=add(new THREE.PlaneGeometry(60,60),M('#2a231f',{roughness:1}),0,-.02,0,null,true);outside.rotation.x=-Math.PI/2;
const floor=add(new THREE.PlaneGeometry(W*2,D*2),M('#ffffff',{map:tileTex,roughness:.55}),0,0,0,null,true);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
function wall(w,h,mat,x,y,z,ry,cast){const m=add(new THREE.PlaneGeometry(w,h),mat,x,y,z,null,true);m.rotation.y=ry;m.receiveShadow=true;m.castShadow=!!cast;return m}
const wallM=M('#ffffff',{map:plasterTex,roughness:.95});

  const o=myState(),j=JSON.stringify(o),now=Date.now();

  lastSent=j;lastSendAt=now;lastKeep=now;pub('st/'+myId,o);

  try{
    ch=window.mqtt.connect(BROKER,{clientId:'uhwa_'+myId,clean:true,keepalive:30,reconnectPeriod:3000,connectTimeout:10000,
      will:{topic:P+'bye/'+myId,payload:'1',qos:0,retain:false}});
    ch.on('connect',()=>{live=true;ch.subscribe(P+'#',{qos:0},()=>{pub('hi',{id:myId});if(entered)sendPresence(true)});updateCount()});
    ch.on('close',()=>{live=false;updateCount()});ch.on('offline',()=>{live=false;updateCount()});ch.on('error',()=>{});

      if(!topic.startsWith(P)||buf.length>2048)return;
      const t=topic.slice(P.length);let d=null;try{d=JSON.parse(buf.toString())}catch(e){}
      if(t.startsWith('st/')){if(d&&typeof d==='object'){delete d.m;delete d.mt;upsert(t.slice(3),d)}}
      else if(t==='chat'){if(d&&typeof d.id==='string')upsert(d.id,{m:d.m,mt:d.mt})}
      else if(t==='hi'){if(d&&d.id!==myId)sendPresence(true)}
      else if(t.startsWith('bye/')){if(others.delete(t.slice(4))){emitPeers()}updateCount()}
    });
  }catch(e){ch=null;updateCount()}
}

    if(player.a==='read'||player.a==='work')setAction(player.a);if(player.a==='pet'||player.a==='order'||player.a==='yay')player.a='';
    const n=Math.min(1,m);fwd/=m;str/=m;
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const vx=(fx*fwd+rx*str)*2.6*n,vz=(fz*fwd+rz*str)*2.6*n;
    player.x+=vx*dt;player.z+=vz*dt;collide(player);player.r=Math.atan2(vx,vz);moving=true;
  }else if(moveTo&&entered){
    const dx=moveTo.x-player.x,dz=moveTo.z-player.z,d=Math.hypot(dx,dz);
    if(d<.1||(moveTo.seat>=0&&d<.32))arrive();
    else{
      if(player.a==='read'||player.a==='work')setAction(player.a);if(player.a==='pet'||player.a==='order'||player.a==='yay')player.a='';
      const step=Math.min(d,2.6*dt);player.x+=dx/d*step;player.z+=dz/d*step;collide(player);player.r=Math.atan2(dx,dz);moving=true;
      if(d<moveTo.best-.04){moveTo.best=d;moveTo.stuck=0}else{moveTo.stuck+=dt;if(moveTo.stuck>.9){if((moveTo.seat>=0||moveTo.pet||moveTo.order)&&d<1.4)arrive();else moveTo=null}}
    }
  }
  if(player.s>=0){const s=SEATS[player.s];player.x=s.x;player.z=s.z;player.r=s.r}
  const g=player.g;g.position.x=player.x;g.position.z=player.z;
  let dr=player.r-g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));g.rotation.y+=dr*Math.min(1,dt*12);
  animChar(g,player,performance.now()/1000,moving,dt);
  if(entered){const ns=player.s>=0?-2:nearestSeat();sitBtn.disabled=ns===-1;sitBtn.innerHTML=player.s>=0?'<b>F</b>🚶 일어나기':'<b>F</b>🪑 앉기';
    hintEl.textContent=ns>=0?'F 를 누르면 앉을 수 있어요':'';hintEl.classList.toggle('on',ns>=0&&!document.body.classList.contains('touch'))}
}
function updateCamera(dt){
  const tx=entered?player.x:0,tz=entered?player.z:1.2;const d=entered?dist:8.5,p=entered?pitch:.42;
  let cx=tx+Math.sin(yaw)*d*Math.cos(p),cz=tz+Math.cos(yaw)*d*Math.cos(p),cy=1+d*Math.sin(p);
  cx=clamp(cx,-W-3,W+3);cz=clamp(cz,-D-3,D+3);cy=clamp(cy,.8,H-.32);
  const k=1-Math.exp(-dt*6);camX+=(cx-camX)*k;camZ+=(cz-camZ)*k;camY+=(cy-camY)*k;
  camera.position.set(camX,camY,camZ);camera.lookAt(tx,entered?1:1.2,tz-(entered?0:2));
}
function placeLabel(lbl,g,now){
  v3.set(g.position.x,g.position.y+1.8,g.position.z).project(camera);
  if(v3.z>1||v3.z<-1){lbl.el.style.visibility='hidden';return}
  lbl.el.style.visibility='visible';
  const x=(v3.x*.5+.5)*innerWidth,y=(-v3.y*.5+.5)*innerHeight;
  lbl.el.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-100%)`;
  if(lbl.bubUntil&&now>lbl.bubUntil){lbl.b.classList.remove('on');lbl.bubUntil=0}
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  applyEnv(dt);updatePlayer(dt);updateRemotes(dt,t);updateCamera(dt);
  if(++frame%8===0)drawWindow(cur,t);
  if(player.a==='pet'&&now>petUntil)player.a='';if(player.a==='yay'&&now>yayUntil)player.a='';updatePetals(dt,t);updateOrder(dt);updateSip(dt);updateWork(dt);updateBarista(dt,t);
  let petting=player.a==='pet';for(const o of remotes.values())if(o.a==='pet'&&Math.hypot(o.g.position.x-CAT_P.x,o.g.position.z-CAT_P.z)<1.6)petting=true;
  catLv+=((petting?1:0)-catLv)*Math.min(1,dt*4);
  catBody.scale.y=.6+Math.sin(t*(1.6+catLv*5))*(.025+catLv*.02);catHead.rotation.z=Math.sin(t*2.2)*.25*catLv;catHead.rotation.x=-.25*catLv;catEyes.visible=catLv<.4;catJoy.visible=catLv>=.4;
  if(catLv>.5){heartT-=dt;if(heartT<0){heartT=.35;spawnHeart()}}
  if(player.a==='work'&&Math.random()<dt*9)sfx('key');if(!moveTo)marker.material.opacity=Math.max(0,marker.material.opacity-dt*2.5);marker.scale.setScalar(1+Math.sin(t*6)*.08);tail.rotation.z=Math.sin(t*(.7+catLv*3))*(.15+catLv*.25);
  renderer.render(scene,camera);
  if(entered)placeLabel(player.lbl,player.g,now);
  for(const o of remotes.values())placeLabel(o.lbl,o.g,now);
}
drawWindow(cur,0);requestAnimationFrame(loop);
})();
