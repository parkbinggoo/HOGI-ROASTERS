<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카페 우화 雨話</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ead9;--bean:#2e221b;--bean2:#4a362b;--terra:#c8734a;--mist:#9fb0c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c1a22;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--cream)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.lbl .nm{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(46,34,27,.62);color:var(--cream);letter-spacing:.02em}
.lbl.me .nm{background:rgba(200,115,74,.85)}
.lbl .bub{display:none;max-width:200px;white-space:normal;margin:0 auto 5px;padding:6px 10px;border-radius:12px;background:var(--cream);color:var(--bean);font-size:13px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.25);word-break:keep-all;overflow-wrap:anywhere}
.lbl .bub.on{display:block}
.lbl .zz{display:none;font-family:'Gowun Batang',serif;font-size:13px;color:var(--mist);animation:zz 2.4s infinite}
.lbl .zz.on{display:block}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#hud{position:fixed;left:16px;top:14px;pointer-events:none}
#hud h1{margin:0;font-family:'Gowun Batang',serif;font-weight:700;font-size:20px;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#hud h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:15px}
#count{margin-top:4px;font-size:13px;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#snd{position:fixed;right:14px;top:14px;display:flex;gap:6px}
.pill{border:1px solid rgba(244,234,217,.25);background:rgba(46,34,27,.55);color:var(--cream);font:inherit;font-size:12px;padding:6px 11px;border-radius:16px;cursor:pointer;backdrop-filter:blur(6px)}
.pill.off{opacity:.45}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(720px,calc(100% - 20px))}
.act{border:1px solid rgba(244,234,217,.2);background:rgba(46,34,27,.7);color:var(--cream);font:inherit;font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s}
.act b{font-weight:400;opacity:.5;margin-right:5px;font-size:11px}
.act.on{background:var(--terra);border-color:var(--terra)}
.act:disabled{opacity:.35;cursor:default}
#chatf{display:flex;flex:1 1 220px;min-width:180px}
#chat{flex:1;border:1px solid rgba(244,234,217,.2);background:rgba(46,34,27,.7);color:var(--cream);font:inherit;font-size:13px;padding:9px 12px;border-radius:12px;outline:none;backdrop-filter:blur(6px)}
#chat::placeholder{color:rgba(244,234,217,.45)}
#chat:focus{border-color:var(--terra)}
#log{position:fixed;left:16px;bottom:70px;width:min(300px,60vw);pointer-events:none;display:flex;flex-direction:column;gap:3px}
#log div{font-size:12.5px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.8);transition:opacity 1.2s;word-break:keep-all;overflow-wrap:anywhere}
#log div i{font-style:normal;color:#f0b48f}
#hint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);font-size:13px;padding:5px 12px;border-radius:12px;background:rgba(46,34,27,.7);opacity:0;transition:opacity .25s;pointer-events:none}
#hint.on{opacity:1}
#joy{position:fixed;left:22px;bottom:84px;width:116px;height:116px;border-radius:50%;background:rgba(244,234,217,.08);border:1px solid rgba(244,234,217,.2);display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(244,234,217,.35)}
body.touch #joy{display:block;bottom:150px}
body.touch #log{bottom:280px}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(46,34,27,.55),rgba(20,18,24,.92));z-index:10;transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
.card{width:min(380px,calc(100% - 40px));text-align:center;padding:34px 28px 26px}
.card .kicker{font-size:12px;letter-spacing:.3em;opacity:.6}
.card h2{font-family:'Gowun Batang',serif;font-size:40px;margin:10px 0 2px;letter-spacing:.06em}
.card h2 small{font-size:22px;opacity:.6;margin-left:6px}
.card p.tag{font-family:'Gowun Batang',serif;font-size:15px;opacity:.85;margin:14px 0 26px;line-height:1.7}
.nametag{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.nametag .lab{font-size:12px;opacity:.6}
#nm{font-family:'Gowun Batang',serif;font-size:19px;color:#f0c9a8}
#reroll{border:none;background:none;color:var(--cream);opacity:.6;cursor:pointer;font-size:16px;padding:4px}
#reroll:hover{opacity:1}
#swatch{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
#swatch button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#swatch button.sel{border-color:var(--cream);transform:scale(1.15)}
#enter{border:none;background:var(--terra);color:#fff;font:inherit;font-size:16px;padding:12px 34px;border-radius:24px;cursor:pointer;letter-spacing:.06em;box-shadow:0 6px 20px rgba(200,115,74,.35)}
#enter:hover{filter:brightness(1.08)}
.keys{margin-top:20px;font-size:12px;opacity:.55;line-height:1.8}
@media (max-width:560px){#hud h1{font-size:17px}.act{padding:7px 9px;font-size:12px}.act b{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud"><h1>카페 우화<span>雨話</span></h1><div id="count">문을 여는 중…</div></div>
<div id="snd"><button class="pill" id="tMusic">음악</button><button class="pill" id="tRain">빗소리</button></div>
<div id="log"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<div id="bar">
  <button class="act" data-a="sip"><b>1</b>☕ 홀짝</button>
  <button class="act" data-a="read"><b>2</b>📖 책 읽기</button>
  <button class="act" data-a="doze"><b>3</b>💤 꾸벅</button>
  <button class="act" id="sitBtn"><b>F</b>🪑 앉기</button>
  <form id="chatf" autocomplete="off"><input id="chat" maxlength="80" placeholder="Enter 로 한마디 남기기"></form>
</div>
<div id="intro">
  <div class="card">
    <div class="kicker">AN AFTERNOON CAFE IN THE RAIN</div>
    <h2>우화<small>雨話</small></h2>
    <p class="tag">비가 그칠 때까지,<br>아무것도 하지 않아도 되는 자리.</p>
    <div class="nametag"><span class="lab">오늘의 이름</span><span id="nm"></span><button id="reroll" title="다른 이름">↻</button></div>
    <div id="swatch"></div>
    <button id="enter">문 열고 들어가기</button>
    <div class="keys">WASD·방향키 이동 · 드래그 시점 · F 앉기<br>1 홀짝 · 2 책 · 3 꾸벅 · Enter 대화</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- identity ---------- */
const ADJ=['김이 오르는','반쯤 식은','창가의','비 맞은','졸린','느긋한','쌉싸름한','조용한','따뜻한','젖은','늦은 오후의','접힌','바스락거리는','말랑한','흐린','설탕 없는','두 번째 잔의','우산 없는'];
const NOUN=['라떼','우산','각설탕','머그잔','책갈피','원두','시나몬','빗방울','휘핑','마들렌','찻잎','스콘','고양이','엽서','모카','크레마','비스코티','유리창'];
const COLORS=['#e8a87c','#c38d9e','#85a392','#7fa7c9','#d9b26f','#b5838d','#8e9aaf','#e07a5f'];
const newName=()=>pick(ADJ)+' '+pick(NOUN);
let me={name:newName(),c:Math.floor(Math.random()*COLORS.length)};
try{const s=JSON.parse(localStorage.getItem('uhwa-me')||'null');if(s&&typeof s.name==='string'&&s.name.length<30&&COLORS[s.c])me={name:s.name,c:s.c}}catch(e){}
function saveMe(){try{localStorage.setItem('uhwa-me',JSON.stringify(me))}catch(e){}}

/* ---------- renderer ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1c1a22');
const camera=new THREE.PerspectiveCamera(50,1,0.1,80);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?64:50;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o||{}));
function add(geo,mat,x,y,z,parent,noShadow){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(!noShadow){m.castShadow=true;m.receiveShadow=true}(parent||scene).add(m);return m}
const box=(w,h,d,mat,x,y,z,p,ns)=>add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p,ns);
const cyl=(rt,rb,h,mat,x,y,z,p,seg)=>add(new THREE.CylinderGeometry(rt,rb,h,seg||20),mat,x,y,z,p);
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}

/* ---------- textures ---------- */
const woodTex=canvasTex(512,512,(g,w,h)=>{
  const rows=8,ph=h/rows;
  for(let r=0;r<rows;r++){let x=-(r%2)*120;while(x<w){const len=rand(160,300);const l=rand(30,42);g.fillStyle=`hsl(${rand(22,30)},${rand(32,42)}%,${l}%)`;g.fillRect(x,r*ph,len,ph);
    g.strokeStyle='rgba(30,18,10,.18)';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();const yy=r*ph+rand(4,ph-4);g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+rand(-3,3),x+len*.6,yy+rand(-3,3),x+len,yy);g.stroke()}
    g.fillStyle='rgba(20,12,8,.55)';g.fillRect(x,r*ph,2,ph);x+=len}
    g.fillStyle='rgba(20,12,8,.5)';g.fillRect(0,r*ph,w,2)}
},[3,2.5]);
const plasterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d9c9b2';g.fillRect(0,0,w,h);for(let i=0;i<2200;i++){g.fillStyle=`rgba(${Math.random()<.5?255:120},${Math.random()<.5?240:100},${200},${rand(.02,.06)})`;g.fillRect(rand(0,w),rand(0,h),rand(1,4),rand(1,4))}},[4,2]);

/* ---------- room ---------- */
const W=8,D=6,H=3.8;
const floor=add(new THREE.PlaneGeometry(W*2,D*2),M('#ffffff',{map:woodTex,roughness:.7}),0,0,0);floor.rotation.x=-Math.PI/2;floor.castShadow=false;
const outside=add(new THREE.PlaneGeometry(60,60),M('#241c17',{roughness:1}),0,-.02,0,null,true);outside.rotation.x=-Math.PI/2;
const ceil=add(new THREE.PlaneGeometry(W*2,D*2),M('#3b2a20'),0,H,0,null,true);ceil.rotation.x=Math.PI/2;
const beamM=M('#2e2018');for(let z=-4.5;z<=4.5;z+=3)box(W*2,.2,.28,beamM,0,H-.1,z,null,true);
const wallM=M('#ffffff',{map:plasterTex,roughness:.95});
// inward-facing planes: invisible from outside, so the camera can orbit freely (dollhouse view)
function wall(w,h,mat,x,y,z,ry){const m=add(new THREE.PlaneGeometry(w,h),mat,x,y,z,null,true);m.rotation.y=ry;m.receiveShadow=true;return m}
wall(D*2,H,wallM,-W,H/2,0,Math.PI/2);wall(D*2,H,wallM,W,H/2,0,-Math.PI/2);wall(W*2,H,wallM,0,H/2,D,Math.PI);
const wainM=M('#5a3e2e');wall(W*2,1,wainM,0,.5,D-.01,Math.PI);wall(D*2,1,wainM,-W+.01,.5,0,Math.PI/2);wall(D*2,1,wainM,W-.01,.5,0,-Math.PI/2);
// window wall (z=-D)
wall(W*2,.9,wainM,0,.45,-D,0);wall(W*2,.8,wallM,0,H-.4,-D,0);
const frameM=M('#2a1d16');
for(const x of [-7.95,-4,0,4,7.95])box(.14,2.1,.2,frameM,x,1.95,-D);
box(W*2,.08,.18,frameM,0,1.95,-D);box(W*2,.1,.2,frameM,0,3.0,-D);box(W*2,.06,.42,M('#6b4a36'),0,.93,-D+.12);

/* ---------- rainy window ---------- */
const WC=document.createElement('canvas');WC.width=1400;WC.height=200;const wx=WC.getContext('2d');
const BG=document.createElement('canvas');BG.width=1400;BG.height=200;(function(){const g=BG.getContext('2d'),w=1400,h=200;
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2a3350');gr.addColorStop(.7,'#47506a');gr.addColorStop(1,'#5b5868');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let x=0;x<w;){const bw=rand(50,140),bh=rand(40,130);g.fillStyle=`rgba(${rand(25,40)},${rand(28,42)},${rand(45,60)},.9)`;g.fillRect(x,h-bh,bw,bh);
    for(let i=0;i<bw*bh/500;i++){if(Math.random()<.45){g.fillStyle=`rgba(255,${rand(190,225)},${rand(120,160)},${rand(.25,.6)})`;g.fillRect(x+rand(4,bw-8),h-bh+rand(6,bh-10),3,4)}}x+=bw+rand(0,20)}
  g.filter='blur(5px)';const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(BG,0,0);g.clearRect(0,0,w,h);g.drawImage(tmp,0,0);g.filter='none';
  for(let i=0;i<70;i++){const x=rand(0,w),y=rand(60,h),r=rand(6,22),warm=Math.random()<.65;const rg=g.createRadialGradient(x,y,0,x,y,r);const c=warm?'255,190,120':'160,200,255';rg.addColorStop(0,`rgba(${c},${rand(.25,.5)})`);rg.addColorStop(1,`rgba(${c},0)`);g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
})();
const streaks=[];for(let i=0;i<220;i++)streaks.push({x:rand(0,1400),y:rand(0,200),l:rand(8,22),v:rand(260,420)});
const beads=[];for(let i=0;i<120;i++)beads.push({x:rand(0,1400),y:rand(0,200),r:rand(1,2.6),v:Math.random()<.15?rand(4,14):0});
const winTex=new THREE.CanvasTexture(WC);winTex.encoding=THREE.sRGBEncoding;
const glass=add(new THREE.PlaneGeometry(15.8,2.1),new THREE.MeshBasicMaterial({map:winTex,toneMapped:false}),0,1.95,-D-.04,null,true);
let lastWin=0;
function drawWindow(t,dt){
  wx.drawImage(BG,0,0);
  wx.strokeStyle='rgba(205,220,240,.22)';wx.lineWidth=1;wx.beginPath();
  for(const s of streaks){s.y+=s.v*dt;s.x-=s.v*dt*.08;if(s.y>200){s.y=-20;s.x=rand(0,1430)}wx.moveTo(s.x,s.y);wx.lineTo(s.x+s.l*.08,s.y-s.l)}wx.stroke();
  for(const b of beads){if(b.v){b.y+=b.v*dt;if(b.y>205){b.y=-5;b.x=rand(0,1400)}}wx.fillStyle='rgba(210,225,245,.28)';wx.beginPath();wx.arc(b.x,b.y,b.r,0,7);wx.fill();wx.fillStyle='rgba(255,255,255,.35)';wx.fillRect(b.x-b.r*.4,b.y-b.r*.5,1,1)}
  winTex.needsUpdate=true;
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight('#ffe2bf','#3a2a22',.42));
const cool=new THREE.DirectionalLight('#9fb6d6',.5);cool.position.set(3,6,-11);cool.castShadow=true;cool.shadow.mapSize.set(1024,1024);
Object.assign(cool.shadow.camera,{left:-10,right:10,top:8,bottom:-8,near:1,far:30});cool.shadow.bias=-.0008;scene.add(cool);
const warmFill=new THREE.DirectionalLight('#ffcf9a',.22);warmFill.position.set(-4,5,6);scene.add(warmFill);
function pendant(x,z,light){
  add(new THREE.CylinderGeometry(.008,.008,1.2,4),M('#111'),x,H-.6,z,null,true);
  const sh=add(new THREE.ConeGeometry(.26,.24,24,1,true),M('#1f1814',{side:THREE.DoubleSide,roughness:.5,metalness:.3}),x,H-1.25,z,null,true);
  add(new THREE.SphereGeometry(.08,12,10),new THREE.MeshBasicMaterial({color:'#ffd9a0',toneMapped:false}),x,H-1.36,z,null,true);
  if(light){const p=new THREE.PointLight('#ffb36b',.9,8.5,2);p.position.set(x,H-1.45,z);scene.add(p)}
}

/* ---------- furniture & colliders ---------- */
const COL=[]; // [minx,maxx,minz,maxz]
const SEATS=[]; // {x,z,r,y}
const woodM=M('#6b4a36',{roughness:.6}),darkWood=M('#3d2a20',{roughness:.6}),metal=M('#2b2b2b',{roughness:.4,metalness:.6});
const fabric=[M('#8a5a44'),M('#7d8a6a'),M('#a77e58'),M('#6f7f94')];
function chair(x,z,r,stool){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=r;scene.add(g);
  if(stool){cyl(.2,.2,.06,darkWood,0,.72,0,g);cyl(.03,.05,.72,metal,0,.36,0,g);add(new THREE.TorusGeometry(.16,.015,6,20),metal,0,.3,0,g).rotation.x=Math.PI/2;SEATS.push({x,z,r,y:.55});return}
  const fm=pick(fabric);box(.46,.06,.46,fm,0,.46,0,g);
  for(const a of [[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]])box(.04,.46,.04,darkWood,a[0],.23,a[1],g);
  box(.46,.42,.05,darkWood,0,.72,-.21,g);
  SEATS.push({x,z,r,y:.3});
}
function table(x,z){
  cyl(.56,.56,.05,woodM,x,.75,z,null,32);cyl(.04,.05,.72,metal,x,.37,z);cyl(.3,.32,.03,metal,x,.015,z);
  COL.push([x-.56,x+.56,z-.56,z+.56]);
  const k=Math.random();
  if(k<.55){cyl(.07,.06,.13,M('#f2ece2',{roughness:.3}),x+rand(-.2,.2),.84,z+rand(-.2,.2))}
  else{cyl(.06,.05,.1,M('#b5654a'),x,.83,z);add(new THREE.SphereGeometry(.1,10,8),M('#5f7d4e'),x,.94,z)}
  chair(x-.95,z,Math.PI/2);chair(x+.95,z,-Math.PI/2);
}
[[-4.6,-2.0],[-1.3,-0.6],[1.9,-2.2],[-4.4,1.8],[-1.0,3.0],[2.3,1.2]].forEach((p,i)=>{table(p[0],p[1]);pendant(p[0],p[1],i%2===0||i===5)});

// window bar & stools
box(10.2,.06,.55,woodM,-2,1.05,-5.4);box(.06,1.02,.06,metal,-7,.51,-5.3);box(.06,1.02,.06,metal,3,.51,-5.3);
COL.push([-7.1,3.1,-5.75,-5.12]);
for(const x of [-6.3,-4.7,-3.1,-1.5,.1,1.7])chair(x,-4.75,Math.PI,true);

// counter (east)
box(1,1.05,6,M('#4a3428'),5.7,.525,-.8);box(1.15,.07,6.15,M('#c9b8a2',{roughness:.35}),5.7,1.085,-.8);
for(let z=-3.6;z<=2;z+=.3)box(.04,.9,.08,darkWood,5.18,.5,z,null,true);

    if(d2<PR*PR){if(d2>1e-8){const d=Math.sqrt(d2),k=(PR-d)/d;p.x+=dx*k;p.z+=dz*k}else{const l=p.x-b[0],r=b[1]-p.x,t=p.z-b[2],bt=b[3]-p.z,m=Math.min(l,r,t,bt);if(m===l)p.x=b[0]-PR;else if(m===r)p.x=b[1]+PR;else if(m===t)p.z=b[2]-PR;else p.z=b[3]+PR}}}

/* ---------- remote players ---------- */
const remotes=new Map();
function str(v,n){return typeof v==='string'?v.slice(0,n):''}
function num(v,a,b,d){return typeof v==='number'&&isFinite(v)?clamp(v,a,b):d}
function syncPeers(peers){
  const seen=new Set();
  for(const p of peers){
    if(p.sameTab||p.kind!=='viewer')continue;
    const pr=p.presence||{};if(typeof pr.x!=='number'||!pr.n)continue;
    seen.add(p.peer);
    let o=remotes.get(p.peer);
    const ci=Number.isInteger(pr.c)&&COLORS[pr.c]?pr.c:0;
    if(!o||o.ci!==ci){if(o){scene.remove(o.g);o.lbl.el.remove()}
      o={g:makeChar(ci),lbl:makeLabel(false),ci,tx:0,tz:0,tr:0,a:'',s:-1,mt:0,name:''};remotes.set(p.peer,o);
      o.g.position.set(num(pr.x,-W,W,0),0,num(pr.z,-D,D,0));o.mt=num(pr.mt,0,1e15,0)}
    o.tx=num(pr.x,-W,W,0);o.tz=num(pr.z,-D,D,0);o.tr=num(pr.r,-10,10,0);
    o.a=['sip','read','doze'].includes(pr.a)?pr.a:'';
    o.s=Number.isInteger(pr.s)&&SEATS[pr.s]?pr.s:-1;
    const nm=str(pr.n,24);if(nm!==o.name){o.name=nm;o.lbl.n.textContent=nm+(p.guest?' ·손님':'')}
    const mt=num(pr.mt,0,1e15,0),m=str(pr.m,80);
    if(mt&&mt!==o.mt){o.mt=mt;if(m&&Date.now()-mt<15000){showBubble(o.lbl,m);logLine(nm,m)}}
  }
  for(const [k,o] of remotes)if(!seen.has(k)){scene.remove(o.g);o.lbl.el.remove();remotes.delete(k)}
  updateCount();
}
function updateRemotes(dt,t){
  const k=1-Math.exp(-dt*9);
  for(const o of remotes.values()){
    let tx=o.tx,tz=o.tz,tr=o.tr;if(o.s>=0){tx=SEATS[o.s].x;tz=SEATS[o.s].z;tr=SEATS[o.s].r}
    const dx=tx-o.g.position.x,dz=tz-o.g.position.z;const moving=Math.hypot(dx,dz)>.03&&o.s<0;
    o.g.position.x+=dx*k;o.g.position.z+=dz*k;
    let dr=tr-o.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));o.g.rotation.y+=dr*k;
    animChar(o.g,o,t,moving,dt);
  }
}

/* ---------- realtime (public MQTT over WebSocket, no signup) ---------- */
const BROKER='wss://broker.emqx.io:8084/mqtt';
const P='uhwa-cafe-k7q2/v1/';
let entered=false,ch=null,live=false,lastSent='',lastSendAt=0,lastKeep=0;
const myId=Math.random().toString(36).slice(2,12);
const others=new Map();
function emitPeers(){syncPeers([...others].map(([k,v])=>({peer:k,sameTab:false,kind:'viewer',guest:false,presence:v.st})))}
function updateCount(){
  const el=$('#count');
  if(!live){el.textContent=!ch?(entered?'혼자만의 창가 · 동시 접속 꺼짐':'문을 여는 중…'):'연결하는 중…';return}
  const n=others.size+(entered?1:0);
  el.textContent=n<=1?(entered?'지금은 당신 혼자 비를 피하는 중':'아직 아무도 없어요'):`지금 ${n}명이 비를 피하는 중`;
}
function myState(){return {n:me.name,c:me.c,x:Math.round(player.x*100)/100,z:Math.round(player.z*100)/100,r:Math.round(player.r*100)/100,a:player.a,s:player.s}}
function pub(t,o){if(ch&&live)try{ch.publish(P+t,JSON.stringify(o),{qos:0})}catch(e){}}
function sendPresence(force){
  if(!live||!entered)return;
  const o=myState(),j=JSON.stringify(o),now=Date.now();
  if(!force&&!(j!==lastSent&&now-lastSendAt>250)&&now-lastKeep<5000)return;
  lastSent=j;lastSendAt=now;lastKeep=now;pub('st/'+myId,o);
}
setInterval(sendPresence,100);
function upsert(id,patch){if(id===myId||!/^[a-z0-9]{4,16}$/.test(id))return;const prev=others.get(id);others.set(id,{st:Object.assign({},prev?prev.st:{},patch),seen:Date.now()});emitPeers()}
function connectMQTT(){
  if(!window.mqtt||!window.mqtt.connect){updateCount();return}
  try{
    ch=window.mqtt.connect(BROKER,{clientId:'uhwa_'+myId,clean:true,keepalive:30,reconnectPeriod:3000,connectTimeout:10000,
      will:{topic:P+'bye/'+myId,payload:'1',qos:0,retain:false}});
    ch.on('connect',()=>{live=true;ch.subscribe(P+'#',{qos:0},()=>{pub('hi',{id:myId});if(entered)sendPresence(true)});updateCount()});
    ch.on('close',()=>{live=false;updateCount()});ch.on('offline',()=>{live=false;updateCount()});ch.on('error',()=>{});
    ch.on('message',(topic,buf)=>{
      if(!topic.startsWith(P)||buf.length>2048)return;
      const t=topic.slice(P.length);let d=null;try{d=JSON.parse(buf.toString())}catch(e){}
      if(t.startsWith('st/')){if(d&&typeof d==='object'){delete d.m;delete d.mt;upsert(t.slice(3),d)}}
      else if(t==='chat'){if(d&&typeof d.id==='string')upsert(d.id,{m:d.m,mt:d.mt})}
      else if(t==='hi'){if(d&&d.id!==myId)sendPresence(true)}
      else if(t.startsWith('bye/')){if(others.delete(t.slice(4))){emitPeers()}updateCount()}
    });
  }catch(e){ch=null;updateCount()}
}
connectMQTT();
addEventListener('pagehide',()=>{if(live&&entered){try{ch.publish(P+'bye/'+myId,'1')}catch(e){}}});
setInterval(()=>{const now=Date.now();let c=false;for(const [k,v] of others)if(now-v.seen>16000){others.delete(k);c=true}if(c)emitPeers();},3000);

function nearestSeat(){let best=-1,bd=1.35;SEATS.forEach((s,i)=>{const d=Math.hypot(s.x-player.x,s.z-player.z);if(d<bd&&!occupied(i)){bd=d;best=i}});return best}

function startAudio(){
  try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=actx.createGain();master.gain.value=.85;master.connect(actx.destination);
  // rain
  const len=actx.sampleRate*3,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.1}
  const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=280;
  rainBus=actx.createGain();rainBus.gain.value=.5;src.connect(hp);hp.connect(lp);lp.connect(rainBus);rainBus.connect(master);src.start();
  (function drip(){if(!actx)return;const t=actx.currentTime;const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(rand(1600,3200),t);o.frequency.exponentialRampToValueAtTime(rand(700,1100),t+.06);g.gain.setValueAtTime(rand(.01,.03),t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g);g.connect(rainBus);o.start(t);o.stop(t+.1);setTimeout(drip,rand(250,1400))})();
  // music
  musicBus=actx.createGain();musicBus.gain.value=.22;const mlp=actx.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=1700;
  const dly=actx.createDelay();dly.delayTime.value=.42;const fb=actx.createGain();fb.gain.value=.28;const wet=actx.createGain();wet.gain.value=.3;
  musicBus.connect(mlp);mlp.connect(master);mlp.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(master);
  const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59],[46,50,53,57],[45,48,52,55],[50,53,57,60],[43,47,50,53]];
  const PENTA=[72,74,76,79,81,84];const beat=60/68;let next=actx.currentTime+.3,step=0;
  const f=m=>440*Math.pow(2,(m-69)/12);
  function note(m,t,dur,vel){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f(m);o2.frequency.value=f(m)*2.002;
    const g2=actx.createGain();g2.gain.value=.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.015);g.gain.exponentialRampToValueAtTime(vel*.35,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(musicBus);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)}
  setInterval(()=>{if(!actx)return;while(next<actx.currentTime+.6){const bar=Math.floor(step/4)%CH.length,b=step%4;
      if(b===0){CH[bar].forEach((m,i)=>note(m,next+i*.025,beat*4.2,.09));note(CH[bar][0]-12,next,beat*3.5,.12)}
      if(b===2&&Math.random()<.6)note(CH[bar][0]-12,next,beat*1.6,.07);
      if(Math.random()<.32)note(pick(PENTA),next+(Math.random()<.4?beat/2:0),beat*1.5,.045);
      next+=beat;step++}},150);
}
function sfx(kind){if(!actx)return;const t=actx.currentTime;
  if(kind==='clink'){[2637,3951].forEach((fq,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=fq;g.gain.setValueAtTime(.05/(i+1),t);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4)})}
  else{const n=actx.createBufferSource(),b=actx.createBuffer(1,actx.sampleRate*.2,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=kind==='page'?3200:500;const g=actx.createGain();g.gain.value=kind==='page'?.12:.2;n.connect(bp);bp.connect(g);g.connect(master);n.start(t)}}
$('#tMusic').addEventListener('click',e=>{musicOn=!musicOn;e.target.classList.toggle('off',!musicOn);if(musicBus)musicBus.gain.setTargetAtTime(musicOn?.22:0,actx.currentTime,.3)});
$('#tRain').addEventListener('click',e=>{rainOn=!rainOn;e.target.classList.toggle('off',!rainOn);if(rainBus)rainBus.gain.setTargetAtTime(rainOn?.5:0,actx.currentTime,.3)});

/* ---------- intro ---------- */
const nmEl=$('#nm'),sw=$('#swatch');
function renderIntro(){nmEl.textContent=me.name;[...sw.children].forEach((b,i)=>b.classList.toggle('sel',i===me.c))}
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.title='옷 색';b.addEventListener('click',()=>{me.c=i;renderIntro()});sw.appendChild(b)});
$('#reroll').addEventListener('click',()=>{me.name=newName();renderIntro()});
renderIntro();
$('#enter').addEventListener('click',()=>{
  saveMe();
  scene.remove(player.g);player.g=makeChar(me.c);player.g.position.set(player.x,0,player.z);player.g.rotation.y=player.r;
  player.lbl.n.textContent=me.name+' (나)';player.lbl.el.style.display='';
  entered=true;$('#intro').classList.add('hide');
  startAudio();if(actx&&actx.state==='suspended')actx.resume();
  sendPresence(true);updateCount();
});

/* ---------- loop ---------- */
const hintEl=$('#hint');const v3=new THREE.Vector3();let camX=0,camZ=8,camY=4;let frame=0;
function updatePlayer(dt){
  let fwd=0,str=0;
  if(entered&&document.activeElement!==chatIn){if(keys.w||keys.arrowup)fwd+=1;if(keys.s||keys.arrowdown)fwd-=1;if(keys.d||keys.arrowright)str+=1;if(keys.a||keys.arrowleft)str-=1}
  if(entered){fwd-=jv.y;str+=jv.x}
  const m=Math.hypot(fwd,str);let moving=false;
  if(m>.15){
    if(player.s>=0)standUp();
    if(player.a==='read'||player.a==='doze')setAction(player.a);
    const n=Math.min(1,m);fwd/=m;str/=m;
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const vx=(fx*fwd+rx*str)*2.6*n,vz=(fz*fwd+rz*str)*2.6*n;
    player.x+=vx*dt;player.z+=vz*dt;collide(player);player.r=Math.atan2(vx,vz);moving=true;
  }
  const g=player.g;g.position.x=player.x;g.position.z=player.z;
  let dr=player.r-g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));g.rotation.y+=dr*Math.min(1,dt*12);
  animChar(g,player,performance.now()/1000,moving,dt);
  if(entered){const ns=player.s>=0?-2:nearestSeat();sitBtn.disabled=ns===-1;sitBtn.innerHTML=player.s>=0?'<b>F</b>🚶 일어나기':'<b>F</b>🪑 앉기';
    hintEl.textContent=ns>=0?'F 를 누르면 앉을 수 있어요':'';hintEl.classList.toggle('on',ns>=0&&!document.body.classList.contains('touch'))}
}
function updateCamera(dt){
  const tx=entered?player.x:0,tz=entered?player.z:1.2;
  const d=entered?dist:8.5,p=entered?pitch:.42;
  let cx=tx+Math.sin(yaw)*d*Math.cos(p),cz=tz+Math.cos(yaw)*d*Math.cos(p),cy=1+d*Math.sin(p);
  cx=clamp(cx,-W-3,W+3);cz=clamp(cz,-D-3,D+3);cy=clamp(cy,.8,H-.25);
  const k=1-Math.exp(-dt*6);camX+=(cx-camX)*k;camZ+=(cz-camZ)*k;camY+=(cy-camY)*k;
  camera.position.set(camX,camY,camZ);camera.lookAt(tx,entered?1:1.2,tz-(entered?0:2));
}
function placeLabel(lbl,g,seated,now){
  v3.set(g.position.x,g.position.y+1.62,g.position.z).project(camera);
  if(v3.z>1||v3.z<-1){lbl.el.style.visibility='hidden';return}
  lbl.el.style.visibility='visible';
  const x=(v3.x*.5+.5)*innerWidth,y=(-v3.y*.5+.5)*innerHeight;
  lbl.el.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-100%)`;
  if(lbl.bubUntil&&now>lbl.bubUntil){lbl.b.classList.remove('on');lbl.bubUntil=0}
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  updatePlayer(dt);updateRemotes(dt,t);updateCamera(dt);
  if(++frame%2===0)drawWindow(t,dt*2);
  catBody.scale.y=.6+Math.sin(t*1.6)*.025;tail.rotation.z=Math.sin(t*.7)*.15;
  renderer.render(scene,camera);
  if(entered){placeLabel(player.lbl,player.g,player.s>=0,now);player.lbl.z.classList.toggle('on',player.a==='doze')}
  for(const o of remotes.values()){placeLabel(o.lbl,o.g,o.s>=0,now);o.lbl.z.classList.toggle('on',o.a==='doze')}
}
drawWindow(0,0);requestAnimationFrame(loop);
})();
